<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tủ Sách Điện Tử</title>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #2b2b2b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* VÙNG CHỨA SÁCH */
    #viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;
    }

    #book {
      display: none;
    }

    .page {
      background-color: #ffffff !important;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    /* NÚT MỞ TỦ SÁCH */
    .menu-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      background: rgba(30, 30, 30, 0.85);
      color: #fff;
      border: 1px solid #555;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(6px);
      transition: background 0.2s;
    }
    .menu-btn:hover { background: #007bff; border-color: #007bff; }

    /* SIDEBAR DỌC BÊN TRÁI */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      height: 100%;
      background: #1c1c1e;
      color: #fff;
      z-index: 200;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 4px 0 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }
    .sidebar.open { transform: translateX(0); }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-header h3 { font-size: 15px; font-weight: 600; color: #fff; }
    .close-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 20px;
      cursor: pointer;
    }
    .close-btn:hover { color: #fff; }

    .book-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
    }
    .book-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      color: #ccc;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 6px;
      transition: background 0.2s, color 0.2s;
    }
    .book-item:hover { background: #2c2c2e; color: #fff; }
    .book-item.active { background: #007bff; color: #fff; font-weight: 600; }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 150;
      display: none;
    }
    .overlay.active { display: block; }

    /* THANH CÔNG CỤ DƯỚI ĐÁY */
    .toolbar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(8px);
      padding: 4px 14px;
      border-radius: 25px;
      color: #fff;
      font-size: 13px;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .toolbar button {
      background: #444;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .toolbar button:hover { background: #007bff; }

    /* Ô NHẬP TRANG */
    .page-input-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #2a2a2a;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid #555;
    }
    .page-input-box input {
      width: 44px;
      background: transparent;
      border: none;
      color: #00e1ff;
      font-weight: 700;
      font-size: 13px;
      text-align: center;
      outline: none;
    }
    .page-input-box input::-webkit-outer-spin-button,
    .page-input-box input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- Nút mở Tủ sách -->
  <button class="menu-btn" id="open-menu">☰ <span>Tủ Sách</span></button>

  <!-- Sidebar dọc bên trái -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>📚 Danh Mục Sách</h3>
      <button class="close-btn" id="close-menu">✕</button>
    </div>
    <div class="book-list" id="book-list"></div>
  </div>

  <div class="overlay" id="overlay"></div>

  <!-- Vùng hiển thị sách -->
  <div id="viewport">
    <div id="book"></div>
  </div>

  <!-- Thanh công cụ điều hướng -->
  <div class="toolbar">
    <button id="btn-prev" title="Trang trước (←)">‹ Trước</button>
    
    <div class="page-input-box" title="Nhập số trang rồi bấm Enter để nhảy tới">
      <input type="number" id="page-input" value="1" min="1" />
      <span style="color:#888;">/</span>
      <span id="total-pages">1</span>
    </div>

    <button id="btn-next" title="Trang sau (→)">Sau ›</button>
    <button id="btn-fullscreen">⛶ Toàn màn hình</button>
  </div>

  <script>
    // =========================================================================
    // ⚙️ DANH SÁCH SÁCH & TỔNG SỐ TRANG
    // =========================================================================
    const BOOKS_DATA = {
      "sach-1": {
        title: "Quyển 1: TƯƠNG TÁC THUỐC BẤT LỢI VÀ NHỮNG LƯU Ý KHI KÊ ĐƠN, CHỈ ĐỊNH THUỐC TRÊN LÂM SÀNG",
        folder: "books/sach-1",
        totalPages: 93,
        ratio: 1.294,
        showCover: true
      },
      "sach-2": {
        title: "Quyển 2: SỔ TAY SỬ DỤNG THUỐC HỢP LÝ",
        folder: "books/sach-2",
        totalPages: 131,
        ratio: 1.444,
        showCover: true
      },
      "sach-3": {
        title: "Quyển 3: CẨM NANG ĐỒ HỌA SỬ DỤNG KHÁNG SINH TẠI BỆNH VIỆN",
        folder: "books/sach-3",
        totalPages: 90,
        ratio: 1.294,
        showCover: true
      }
    };

    let pageFlip = null;
    const viewport = document.getElementById("viewport");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const bookList = document.getElementById("book-list");
    const pageInput = document.getElementById("page-input");
    const totalPagesSpan = document.getElementById("total-pages");

    const urlParams = new URLSearchParams(window.location.search);
    let currentBookKey = urlParams.get("book") || Object.keys(BOOKS_DATA)[0];

    // Tạo danh sách sách bên trái
    for (const key in BOOKS_DATA) {
      const item = document.createElement("div");
      item.className = `book-item ${key === currentBookKey ? 'active' : ''}`;
      item.innerHTML = `📖 <span>${BOOKS_DATA[key].title}</span>`;
      item.onclick = () => {
        document.querySelectorAll(".book-item").forEach(el => el.classList.remove("active"));
        item.classList.add("active");
        closeSidebar();
        currentBookKey = key;
        loadBook(key);
      };
      bookList.appendChild(item);
    }

    function openSidebar() {
      sidebar.classList.add("open");
      overlay.classList.add("active");
    }
    function closeSidebar() {
      sidebar.classList.remove("open");
      overlay.classList.remove("active");
    }
    document.getElementById("open-menu").onclick = openSidebar;
    document.getElementById("close-menu").onclick = closeSidebar;
    overlay.onclick = closeSidebar;

    // Tính kích thước vừa vặn màn hình
    function calculateBookSize(bookData) {
      const availWidth = viewport.clientWidth - 20;
      const availHeight = viewport.clientHeight - 65; 
      const isMobile = window.innerWidth < 768;
      const ratio = (bookData && bookData.ratio) ? bookData.ratio : 1.414;

      let singlePageWidth, singlePageHeight;

      if (isMobile) {
        singlePageHeight = availHeight;
        singlePageWidth = singlePageHeight / ratio;
        if (singlePageWidth > availWidth) {
          singlePageWidth = availWidth;
          singlePageHeight = singlePageWidth * ratio;
        }
      } else {
        singlePageHeight = availHeight;
        singlePageWidth = singlePageHeight / ratio;
        if (singlePageWidth * 2 > availWidth) {
          singlePageWidth = availWidth / 2;
          singlePageHeight = singlePageWidth * ratio;
        }
      }

      return {
        width: Math.floor(singlePageWidth),
        height: Math.floor(singlePageHeight)
      };
    }

    // Tải sách
    function loadBook(bookKey) {
      const bookData = BOOKS_DATA[bookKey];
      if (!bookData) return;

      // 1. Hủy flipbook cũ an toàn
      if (pageFlip) {
        try { pageFlip.destroy(); } catch (e) {}
        pageFlip = null;
      }

      // 2. Tái tạo lại thẻ #book trong #viewport
      viewport.innerHTML = '<div id="book" class="flip-book"></div>';
      const currentBook = document.getElementById("book");

      // 3. Nếu sách chưa có ảnh hoặc totalPages = 0 (như Sách 3)
      if (!bookData.totalPages || bookData.totalPages === 0) {
        viewport.innerHTML = `<div style="color: #bbb; text-align: center; padding: 40px; background: rgba(0,0,0,0.5); border-radius: 12px; border: 1px dashed #555;">
          <h3 style="margin-bottom: 10px; color: #fff;">📖 ${bookData.title}</h3>
          <p>Sách này đang được chuẩn bị và sẽ sớm cập nhật!</p>
        </div>`;
        pageInput.value = 0;
        pageInput.max = 0;
        totalPagesSpan.innerText = 0;
        return;
      }

      // 4. Tạo các trang ảnh
      for (let i = 1; i <= bookData.totalPages; i++) {
        const pageDiv = document.createElement("div");
        pageDiv.className = "page";

        const img = document.createElement("img");
        img.src = `${bookData.folder}/${i}.jpg`;
        img.alt = `Trang ${i}`;
        
        img.onerror = function() {
          this.parentElement.innerHTML = `<div style="padding:15px; text-align:center; color:#888; font-size:12px;">Thiếu: ${bookData.folder}/${i}.jpg</div>`;
        };

        pageDiv.appendChild(img);
        currentBook.appendChild(pageDiv);
      }

      const size = calculateBookSize(bookData);

      pageFlip = new St.PageFlip(currentBook, {
        width: size.width,
        height: size.height,
        size: "fixed",
        maxShadowOpacity: 0.35,
        showCover: bookData.showCover !== undefined ? bookData.showCover : true,
        mobileScrollSupport: false,
        usePortrait: true
      });

      pageFlip.loadFromHTML(currentBook.querySelectorAll(".page"));
      currentBook.style.display = "block";

      function updateCounter() {
        const current = pageFlip.getCurrentPageIndex() + 1;
        const total = pageFlip.getPageCount();
        pageInput.value = current;
        pageInput.max = total;
        totalPagesSpan.innerText = total;
      }

      pageFlip.on("flip", updateCounter);
      pageFlip.on("init", updateCounter);
      updateCounter();
    }

    // Nhảy trang khi gõ số trang
    function jumpToPage() {
      if (!pageFlip) return;
      let target = parseInt(pageInput.value, 10);
      const total = pageFlip.getPageCount();

      if (isNaN(target) || target < 1) target = 1;
      if (target > total) target = total;

      pageInput.value = target;
      pageFlip.flip(target - 1);
    }

    pageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        jumpToPage();
        pageInput.blur();
      }
    });
    pageInput.addEventListener("change", jumpToPage);
    pageInput.addEventListener("focus", function() { this.select(); });

    // Hỗ trợ phím mũi tên ← và → trên bàn phím
    document.addEventListener("keydown", (e) => {
      if (document.activeElement === pageInput) return;
      if (e.key === "ArrowLeft") pageFlip && pageFlip.flipPrev();
      if (e.key === "ArrowRight") pageFlip && pageFlip.flipNext();
    });

    // Tự chỉnh kích thước khi xoay màn hình
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => loadBook(currentBookKey), 250);
    });

    document.getElementById("btn-prev").onclick = () => pageFlip && pageFlip.flipPrev();
    document.getElementById("btn-next").onclick = () => pageFlip && pageFlip.flipNext();

    // Toàn màn hình
    const fsBtn = document.getElementById("btn-fullscreen");
    function isFullScreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
    }
    fsBtn.onclick = function() {
      const docEl = document.documentElement;
      if (!isFullScreen()) {
        const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
        if (req) {
          req.call(docEl).catch(() => window.open(window.location.href, "_blank"));
        } else {
          window.open(window.location.href, "_blank");
        }
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
        if (exit) exit.call(document);
      }
    };

    const handleFSChange = () => setTimeout(() => loadBook(currentBookKey), 200);
    document.addEventListener("fullscreenchange", handleFSChange);
    document.addEventListener("webkitfullscreenchange", handleFSChange);
    document.addEventListener("mozfullscreenchange", handleFSChange);

    // Khởi chạy sách
    loadBook(currentBookKey);
  </script>
</body>
</html>
